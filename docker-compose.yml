services:
  db:
    image: postgis/postgis:18-3.6-alpine
    container_name: keepnet_db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - keepnet_postgres_data:/var/lib/postgresql

  redis:
    image: redis:8.0-alpine
    container_name: keepnet_redis
    restart: always
    ports:
      - "6379:6379"

volumes:
  keepnet_postgres_data: