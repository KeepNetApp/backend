services:
  db:
    image: postgis/postgis:18-3.6-alpine
    container_name: keepnet_db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - keepnet_postgres_data:/var/lib/postgresql

  redis:
    image: redis:8.0-alpine
    container_name: keepnet_redis
    restart: always
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    container_name: keepnet_minio
    restart: always
    ports:
      - "9000:9000"
      - "9001:9001"

    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}

    command: server /data --console-address ":9001"
    volumes:
      - keepnet_minio_data:/data


volumes:
  keepnet_postgres_data:
  keepnet_minio_data: